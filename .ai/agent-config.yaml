# Configuración para Agentes IA (Windsurf/Cursor)
# Sistema de Inventario Escolar

agent_info:
  name: "Code Assistant"
  role: "Developer"
  context_files:
    - "PROYECTO.md"
    - ".claude/CONTEXTO.md"
    - "docs/specs/00-VISION-PROYECTO.md"

project:
  name: "Sistema de Inventario Escolar"
  stack:
    backend: "Django 5.2 + DRF + PostgreSQL 16.6"
    frontend: "Next.js 16 + React 19 + TypeScript 5.7"
    ui: "Tailwind CSS + shadcn/ui"
  
  phase: 0
  status: "Setup - 0%"

standards:
  file_limits:
    max_lines: 300
    max_function_lines: 50
    max_line_length: 100
  
  testing:
    min_coverage: 85
    frameworks:
      backend: "pytest"
      frontend: "jest"
  
  validation:
    - "Doble (cliente + servidor)"
    - "Type hints en Python"
    - "TypeScript strict mode"
    - "Zod en formularios"

git:
  commit_format: "tipo(alcance): descripción"
  commit_types:
    - "feat"
    - "fix"
    - "docs"
    - "refactor"
    - "test"
    - "chore"

validation_commands:
  backend:
    - "cd backend && pytest --cov=apps"
    - "ruff check ."
    - "black --check ."
  frontend:
    - "cd frontend && npm run lint"
    - "npm run type-check"
    - "npm test"

prohibitions:
  - "NO cambiar stack"
  - "NO exceder 300 líneas/archivo"
  - "NO usar localStorage en artifacts"
  - "NO commitear sin actualizar PROYECTO.md"

workflow:
  - "Leer PROYECTO.md"
  - "Confirmar con Edilberto"
  - "Implementar + tests"
  - "Validar"
  - "Actualizar PROYECTO.md"
  - "Commit"
  - "Notificar"
```

